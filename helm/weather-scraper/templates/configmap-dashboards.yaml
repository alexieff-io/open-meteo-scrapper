{{- if .Values.grafanaDashboards.enabled }}
{{- $fullname := include "weather-scraper.fullname" . }}
{{- $labels := include "weather-scraper.labels" . }}
{{- $dashboardLabel := .Values.grafanaDashboards.label }}
{{- $dashboardLabelValue := .Values.grafanaDashboards.labelValue }}
{{- $folder := .Values.grafanaDashboards.folder }}
{{- $annotations := .Values.grafanaDashboards.annotations }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $dashboardName := trimSuffix ".json" (base $path) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-dashboard-{{ $dashboardName }}
  labels:
    {{- $labels | nindent 4 }}
    {{ $dashboardLabel }}: {{ $dashboardLabelValue | quote }}
  annotations:
    grafana_folder: {{ $folder | quote }}
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{/* The chart's dashboards/ copies are embedded as-is. They are kept in sidecar format:
       no import inputs, and type-only datasource references, so Grafana uses the
       default Prometheus-compatible datasource instead of ${DS_VICTORIAMETRICS}. */}}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
